<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#f3f5f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f9;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e2e7ee;border-radius:8px;">
        <tr><td style="padding:28px 32px 8px 32px;font-size:16px;line-height:24px;">
          <p style="margin:0 0 16px 0;font-weight:bold;">{{ saludo }}</p>
          <p style="margin:0 0 20px 0;">{{ introduccion|linebreaksbr }}</p>
        </td></tr>
        <tr><td style="padding:0 32px;">
          <p style="margin:0 0 8px 0;font-size:13px;color:#566276;text-transform:uppercase;letter-spacing:.06em;font-weight:bold;">Orden {{ codigo }}</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:15px;">
            <thead>
              <tr style="background:#eef1f5;">
                <th align="left" style="padding:10px 12px;border:1px solid #d5dbe5;">Artículo</th>
                <th align="right" style="padding:10px 12px;border:1px solid #d5dbe5;white-space:nowrap;">Cantidad</th>
                <th align="left" style="padding:10px 12px;border:1px solid #d5dbe5;">Unidad</th>
              </tr>
            </thead>
            <tbody>
              {% for l in lineas %}
              <tr>
                <td style="padding:10px 12px;border:1px solid #d5dbe5;">{{ l.articulo }}</td>
                <td align="right" style="padding:10px 12px;border:1px solid #d5dbe5;white-space:nowrap;font-weight:bold;">{{ l.cantidad }}</td>
                <td style="padding:10px 12px;border:1px solid #d5dbe5;">{{ l.unidad }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </td></tr>
        <tr><td style="padding:20px 32px 8px 32px;font-size:16px;line-height:24px;">
          <p style="margin:0 0 20px 0;">{{ cierre|linebreaksbr }}</p>
          <p style="margin:0;font-weight:bold;">{{ firmante }}</p>
          <p style="margin:0 0 20px 0;color:#566276;">{{ firma }}</p>
        </td></tr>
        <tr><td style="padding:12px 32px 24px 32px;border-top:1px solid #e2e7ee;font-size:13px;color:#566276;">{{ fecha }}</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
