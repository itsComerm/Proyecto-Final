<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OrderFlow{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'inicio' %}">OrderFlow</a>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3 m-0">
      {% csrf_token %}
      <span class="text-light">{{ user.get_full_name|default:user.username }}</span>
      <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
